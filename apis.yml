aid: bullion-api

name: Bullion API

image: https://bullionapi.dev/opengraph-image

description: Bullion API provides real-time gold spot prices and historical data for developers. It offers cached price observations in over 150
  currencies, a simple REST endpoint, and a free tier with 30 monthly requests. The service targets apps needing indicative valuations, charts,
  and market data without requiring credit cards.

