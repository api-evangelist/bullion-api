      summary: Returns one metal's absolute and percentage change between the final cached observation of two UTC days
      x-source: https://bullionapi.dev/docs.md
      parameters:
      - name: metal
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: ISO 4217 base currency. Defaults to USD.
      - name: unit
        in: query
        required: false
        schema:
          type: string
        description: 'Optional output mass unit: gram/g, kilogram/kg, or troy_oz/toz. Defaults to troy_oz.'
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: First UTC day to compare (YYYY-MM-DD).
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: Last UTC day to compare. Requires start.
      - name: period
        in: query
        required: false
        schema:
          type: string
        description: 'Rolling UTC window ending today: 1d, 1w, 1m, or 1y.'
      - name: api_key
        in: query
        required: false
        schema:
          type: string
        description: Fallback credential for clients that cannot set the X-API-Key header.
